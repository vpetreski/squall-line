[project]
name = "squall-line"
version = "1.0.0"
description = "Weather-aware truck routing: three routes, weather at the truck's ETA, risk rules, a corridor heatmap."
requires-python = ">=3.14"
dependencies = [
    "django==6.1.3",
    "django-ninja==1.7.3",
    "httpx==0.28.1",
    "numpy==2.5.4",
    "tzfpy==2.1.2",
    "whitenoise==6.12.0",
]

[project.optional-dependencies]
redis = [
    "redis==8.1.0",
]

[dependency-groups]
dev = [
    "django-stubs==6.1.2",
    "hypothesis==6.170.14",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "pytest-django==4.14.0",
    "respx==0.23.1",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "RUF", "PERF", "PT"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["config", "planner"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
addopts = "-m 'not live' --strict-markers"
markers = ["live: calls the real routing, geocoding and weather services (run with -m live)"]
filterwarnings = ["error::RuntimeWarning"]

[tool.coverage.run]
source = ["planner", "config"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unreachable = true
disallow_any_generics = false
files = ["planner", "config"]

[[tool.mypy.overrides]]
module = ["tzfpy", "ninja.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
